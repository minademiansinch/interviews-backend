services:
  postgres:
    image: postgres:16-alpine
    container_name: kosta-trust-postgres
    environment:
      POSTGRES_DB: trust_db
      POSTGRES_USER: trust
      POSTGRES_PASSWORD: trust
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U trust -d trust_db"]
      interval: 2s
      timeout: 3s
      retries: 20
